name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - relaunch-v2

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruefen:
    name: Prüfen
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typen prüfen
        run: npm run type-check

      - name: Quelltext prüfen
        run: npm run lint

  einheitstests:
    name: Einheitstests
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Einheitstests ausführen
        run: npm test

  bauen-und-browsertests:
    name: Bauen und Browsertests
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Playwright-Browser zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Chromium und Systemabhängigkeiten installieren
        run: npx playwright install --with-deps chromium

      - name: Statischen Export bauen
        run: ./werkzeuge/export-hostpoint.sh

      - name: Browsertests ausführen
        run: npm run test:e2e -- --reporter=html

      - name: Playwright-Bericht hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-bericht
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14
